apiVersion: apps/v1
kind: Deployment
metadata:
  name: toy-api
  labels:
    app: toy-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: toy-api
  template:
    metadata:
      labels:
        app: toy-api
    spec:
      containers:
        - name: api
          image: k8s-toy-api:local
          imagePullPolicy: IfNotPresent # image is built locally, never pulled from a registry
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
