apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  # In production, use actual secrets management (Sealed Secrets, External Secrets, etc.)
  # For this learning exercise, we use stringData for readability
  POSTGRES_DB: toyapi
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/toyapi
